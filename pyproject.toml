[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "promptforge"
version = "0.1.0"
description = "Local-first, model-aware prompt optimizer. Measurable token savings and quality improvements — no SaaS, no cloud dependency."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Varun Meda", email = "varunmeda95@gmail.com" }]
keywords = ["prompt", "llm", "optimization", "ai", "cli", "prompt-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
rich = ["rich>=13.0"]
tiktoken = ["tiktoken>=0.5"]
full = ["rich>=13.0", "tiktoken>=0.5"]
web  = ["flask>=3.0"]

[project.scripts]
promptforge = "promptforge.cli:main"

[project.urls]
Homepage = "https://github.com/VMaroon95/PromptForge"
Repository = "https://github.com/VMaroon95/PromptForge"
Issues = "https://github.com/VMaroon95/PromptForge/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptforge*"]
